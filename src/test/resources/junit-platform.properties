# Por defecto no se ejecutan:
#  - @known-bug: escenarios que fallan por un defecto ya reportado
#  - @pendiente-requisito: escenarios que dependen de una regla de negocio sin definir
# Para ejecutarlos: mvn test "-Dcucumber.filter.tags=@known-bug or @pendiente-requisito"
cucumber.filter.tags=not @known-bug and not @pendiente-requisito