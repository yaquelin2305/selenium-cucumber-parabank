name: Pruebas E2E (Selenium + Cucumber)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 11 * * *'   # todos los días a las 08:00 de Chile (11:00 UTC)
  workflow_dispatch:       # permite ejecutarlo a mano desde GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Ejecutar pruebas en Chrome sin ventana
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar las pruebas
        run: mvn -B clean test "-Dbrowser=chrome" "-Dheadless=true"

      - name: Preparar el reporte
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reporte
          cp target/cucumber-report.html reporte/index.html

      - name: Guardar el reporte como artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cucumber
          path: reporte/
          retention-days: 14

      - name: Preparar el reporte para GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: reporte/

  publicar:
    name: Publicar el reporte en GitHub Pages
    needs: pruebas
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4